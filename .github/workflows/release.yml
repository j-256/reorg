name: Publish npm package

# Triggers:
#   - push a v* tag      -> validate, package, and publish
#   - workflow_dispatch  -> validate and package, dry run by default
#
# Releases are cut with `npm version <major|minor|patch>` on main, which tags and
# pushes; that tag push is what lands here. Post-release verification and GitHub
# release metadata live in post-release.yml so they cannot turn a successful npm
# publish red after the irreversible write
#
# The filename is load-bearing: npm pins the trusted publisher to one exact
# workflow filename, so renaming this file breaks authentication

on:
  push:
    tags: [v*]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (pack and verify, publish nothing)
        type: boolean
        default: true

permissions:
  contents: read

env:
  RELEASE_ARTIFACT_NAME: release-package

jobs:
  # The atomic main-and-tag push starts CI and this workflow together, so the
  # release must prove browser behavior on the tagged tree for itself
  # Keep this job here because npm trusted publishing pins release.yml directly
  browser:
    runs-on: ubuntu-latest
    name: browser tests (release prerequisite)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Configure git identity for the sandbox repos
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch main

      - name: Run browser tests
        run: npm run test:ui

  package:
    name: Validate release package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # the tag-on-main check needs history

      # A tag pointing at a commit that never reached main would publish code
      # nobody reviewed on main. Only meaningful for tag pushes: a manual dry
      # run from a branch has no tag to check
      #
      # Ask git the question directly rather than grepping `branch -r --contains`
      # output: the substring 'origin/main' also matches 'origin/maintenance',
      # so a commit pushed only to a branch whose name starts with main would
      # pass a grep. --is-ancestor exits 0 when reachable, 1 when not, and 128
      # on a bad ref, so `if !` fails closed on errors too
      - name: Verify the tag is on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Error: tag $GITHUB_REF_NAME is not on the main branch"
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify the tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION="v$(node -p 'require("./package.json").version')"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Error: tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # Same three lines ci.yml sets before both of its test jobs, for the same
      # reason: the suite shells out to git and needs an identity configured
      # rather than merely present. The tests happen to self-configure today, so
      # this is insurance against the first one that does not -- which would
      # otherwise fail here, mid-release, while ci.yml stayed green
      - name: Configure git identity for the sandbox repos
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch main

      # A tag can point at a commit ci.yml never ran on, so re-run the gate
      # rather than trusting a green tick elsewhere. One leg, not the matrix:
      # this suite needs nothing installed
      - name: Run tests
        run: npm test

      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npm pack --pack-destination artifacts
          set -- artifacts/*.tgz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "Error: expected exactly one package tarball"
            exit 1
          fi
          tgz="$1"
          {
            printf '\n**Tarball contents**\n\n'
            echo '```'
            tar tzf "$tgz" | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The check that actually protects a publish: a tarball missing a source
      # file installs broken while every unit test passes. Mirrors ci.yml's
      # package job -- duplicated on purpose, since Actions has no include for
      # step bodies and workflow_call is what npm flags as breaking OIDC
      # trusted-publisher validation
      - name: Verify the packed CLI and Skill from a clean install
        run: |
          set -euo pipefail
          set -- "$PWD"/artifacts/*.tgz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "Error: expected exactly one package tarball"
            exit 1
          fi
          tgz="$1"
          work="$(mktemp -d)"
          cd "$work"
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund "$tgz" >/dev/null 2>&1
          # The package name and the installed command differ on purpose, so
          # assert on the binary rather than assuming they match
          ./node_modules/.bin/reorg --help | head -1
          test -f ./node_modules/reorg-cli/.agents/skills/reorg/SKILL.md
          mkdir -p sample/old-backup && echo hi > sample/keep.txt
          ./node_modules/.bin/reorg triage sample
          # Dry run must be the default: this must not move anything
          ./node_modules/.bin/reorg apply sample
          test -f sample/keep.txt

      - name: Preserve the verified package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.RELEASE_ARTIFACT_NAME }}
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified package
    needs: [browser, package]
    if: ${{ !inputs.dry_run && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    # Load-bearing for authentication, not deployment bookkeeping: npm's trusted
    # publisher for this package specifies environment `prd`, and GitHub only
    # puts an `environment` claim in the OIDC token when the job declares one
    # Without this the claim is absent, npm finds no matching publisher, and the
    # exchange fails with "package not found" after which the publish runs
    # unauthenticated and the registry answers E404
    environment: prd
    steps:
      - name: Download the verified package
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.RELEASE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/release-package

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          # Pins both trusted-publisher authentication and the upload destination
          registry-url: https://registry.npmjs.org

      # No credential here on purpose. npm is configured with this repo, this
      # workflow filename, and the environment above as a trusted publisher, so
      # it exchanges the Actions OIDC token for a short-lived publish token
      #
      # A mismatch in any of those three fails quietly: npm's oidc helper logs at
      # verbose and returns undefined, so the publish proceeds with no credential
      # and the registry answers E404 "you do not have permission" which reads
      # like the package is missing rather than like an auth failure. To see the
      # real reason, POST the id_token to
      # /-/npm/v1/oidc/token/exchange/package/<name> and read its message
      #
      # --access public is mandatory on a first publish, not decoration: npm
      # treats the 404 from a not-yet-published package as "private" and refuses
      # to generate provenance without it. Harmless on every later release
      - name: Publish the verified package to npm
        run: |
          set -euo pipefail
          set -- "$RUNNER_TEMP"/release-package/*.tgz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "Error: expected exactly one verified package tarball"
            exit 1
          fi
          npm publish "$1" --provenance --access public
