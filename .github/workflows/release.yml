name: Release

# Triggers:
#   - push a v* tag      -> validate, test, publish, release
#   - workflow_dispatch  -> the same pipeline, dry run by default
#
# Releases are cut with `npm version patch` on main, which tags and pushes; that
# tag push is what lands here. ci.yml stays a pure test gate and knows nothing
# about publishing.
#
# The filename is load-bearing: npm pins the trusted publisher to one exact
# workflow filename, so renaming this file breaks authentication.

on:
  push:
    tags: [v*]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (pack and verify, publish nothing)
        type: boolean
        default: true

permissions:
  contents: write # create the GitHub release
  id-token: write # authenticate to npm, and sign the provenance attestation

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # the tag-on-main check needs history

      # A tag pointing at a commit that never reached main would publish code
      # nobody reviewed on main. Only meaningful for tag pushes: a manual dry
      # run from a branch has no tag to check.
      #
      # Ask git the question directly rather than grepping `branch -r --contains`
      # output: the substring 'origin/main' also matches 'origin/maintenance',
      # so a commit pushed only to a branch whose name starts with main would
      # pass a grep. --is-ancestor exits 0 when reachable, 1 when not, and 128
      # on a bad ref, so `if !` fails closed on errors too.
      - name: Verify the tag is on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Error: tag $GITHUB_REF_NAME is not on the main branch"
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          # Pins the registry the publish talks to, which is also the registry
          # npm exchanges the OIDC token against. Without it the publish targets
          # whatever default is configured and trusted publishing does not apply.
          registry-url: https://registry.npmjs.org

      - name: Verify the tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION="v$(node -p 'require("./package.json").version')"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Error: tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # Same three lines ci.yml sets before both of its test jobs, for the same
      # reason: the suite shells out to git and needs an identity configured
      # rather than merely present. The tests happen to self-configure today, so
      # this is insurance against the first one that does not -- which would
      # otherwise fail here, mid-release, while ci.yml stayed green.
      - name: Configure git identity for the sandbox repos
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch main

      # A tag can point at a commit ci.yml never ran on, so re-run the gate
      # rather than trusting a green tick elsewhere. One leg, not the matrix:
      # this suite needs nothing installed.
      - name: Run tests
        run: npm test

      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npm pack --pack-destination artifacts
          tgz="$(ls artifacts/*.tgz)"
          {
            printf '\n**Tarball contents**\n\n'
            echo '```'
            tar tzf "$tgz" | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The check that actually protects a publish: a tarball missing a source
      # file installs broken while every unit test passes. Mirrors ci.yml's
      # package job -- duplicated on purpose, since Actions has no include for
      # step bodies and workflow_call is what npm flags as breaking OIDC
      # trusted-publisher validation.
      - name: Verify the packed CLI runs from a clean install
        run: |
          set -euo pipefail
          tgz="$(ls "$PWD"/artifacts/*.tgz)"
          work="$(mktemp -d)"
          cd "$work"
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund "$tgz" >/dev/null 2>&1
          # The package name and the installed command differ on purpose, so
          # assert on the binary rather than assuming they match.
          ./node_modules/.bin/reorg --help | head -1
          mkdir -p sample/old-backup && echo hi > sample/keep.txt
          ./node_modules/.bin/reorg triage sample
          # Dry run must be the default: this must not move anything.
          ./node_modules/.bin/reorg apply sample
          test -f sample/keep.txt

      # No credential here on purpose. npm is configured with this repo and this
      # workflow filename as a trusted publisher, so it exchanges the Actions
      # OIDC token (id-token: write, above) for a short-lived publish token. That
      # leaves nothing long-lived to leak or rotate. Note the exchange only ever
      # ADDS auth -- npm's oidc helper returns quietly on any failure rather than
      # throwing, so a broken trusted-publisher config surfaces as an auth error
      # from the publish itself, not as a confusing fallback.
      #
      # --access public is mandatory on a first publish, not decoration: npm
      # treats the 404 from a not-yet-published package as "private" and refuses
      # to generate provenance without it. Harmless on every later release.
      #
      # Note --dry-run skips the publish path entirely (npm gates libpub behind
      # it), so a dry run proves packing and validation -- not credentials,
      # provenance, or registry acceptance.
      - name: Publish to npm
        id: publish # the release step below keys off this step's conclusion
        run: |
          set -euo pipefail
          set -- --provenance --access public
          if [ "${DRY_RUN:-}" = "true" ]; then
            set -- "$@" --dry-run
          fi
          echo "npm publish $*"
          npm publish "$@"
        env:
          DRY_RUN: ${{ inputs.dry_run }}

      # Distinguishes "we uploaded a tarball" from "a user can install it",
      # which the packed-install check above cannot speak to since it never
      # touches the registry. Cannot gate anything -- the publish above is
      # irreversible -- so it is an alarm, not a check. A freshly published
      # version is not instantly resolvable, hence the retries.
      - name: Smoke test the published package
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          work="$(mktemp -d)"
          cd "$work"
          npm init -y >/dev/null 2>&1
          attempts=5
          for attempt in $(seq "$attempts"); do
            # Keep npm's output: a 404 means propagation lag and retrying is
            # right, while E401/EPERM/a corrupt tarball mean it never will
            # resolve. Silencing this leaves both looking identical in the log,
            # and telling a human what happened is this step's only job.
            if npm install --no-audit --no-fund "reorg-cli@$version" > install.log 2>&1; then
              ./node_modules/.bin/reorg --help | head -1
              echo "Installed reorg-cli@$version from the registry on attempt $attempt"
              exit 0
            fi
            echo "Not resolvable yet (attempt $attempt):"
            tail -5 install.log
            # No sleep after the last attempt -- it would burn 50s before failing
            [ "$attempt" -eq "$attempts" ] && break
            sleep $((attempt * 10))
          done
          echo "Error: reorg-cli@$version did not become installable from the registry"
          echo "The package IS published -- this step cannot and does not undo that."
          exit 1

      # Runs even if the smoke test failed, because the publish above is
      # irreversible: once a version is on the registry, a flaky smoke test must
      # not cost us the release too. A failing step otherwise skips everything
      # after it regardless of its own condition, which would leave a live
      # package with no release. Gated on the publish step specifically, so a
      # failed publish still skips this. `!cancelled()` rather than `always()`
      # -- the docs recommend it, and it still honors a cancelled run.
      - name: Create the GitHub release
        if: ${{ !cancelled() && steps.publish.conclusion == 'success' && startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.tgz --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
